<text x="946.3" y="145" fill="#123c34" font-family="Arial, sans-serif" font-size="17" font-weight="bold">22.881s</text>
<text x="45" y="164" fill="#627c76" font-family="Arial, sans-serif" font-size="13">Japanese hallucination</text>
<text x="45" y="210" fill="#123c34" font-family="Arial, sans-serif" font-size="18" font-weight="600">Whisper · forced EN</text>
