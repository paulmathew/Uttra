<text x="425.5" y="213" fill="#123c34" font-family="Arial, sans-serif" font-size="17" font-weight="bold">4.385s</text>
<text x="45" y="232" fill="#627c76" font-family="Arial, sans-serif" font-size="13">Mixed-language words incorrect</text>
<text x="45" y="278" fill="#123c34" font-family="Arial, sans-serif" font-size="18" font-weight="600">Whisper · forced ML</text>
