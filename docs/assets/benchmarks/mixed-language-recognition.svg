<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="465" viewBox="0 0 1100 465" role="img" aria-labelledby="title desc">
<title id="title">Uttra mixed-utterance recognition experiment</title>
<desc id="desc">One mixed English-Malayalam audio recording. Single-run elapsed method times: Whisper AUTO 22.881 seconds, Whisper English 4.385, Whisper Malayalam 9.235, and IndicConformer Malayalam 2.610 seconds. Accuracy is not comparable and no engine succeeded at mixed transcription.</desc>
<rect width="1100" height="465" rx="22" fill="#f5fbf8"/>
<text x="45" y="56" fill="#123c34" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Same recording. Four recognition paths.</text>
<text x="45" y="83" fill="#51756e" font-family="Arial, sans-serif" font-size="16">Pixel 7a · 7.8A · single-run method time · lower time does not mean correct output</text>

<line x1="293.0" y1="115" x2="293.0" y2="377" stroke="#d6e7e0" stroke-width="1"/>
