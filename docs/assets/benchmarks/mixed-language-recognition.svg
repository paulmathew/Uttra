<line x1="715.4" y1="115" x2="715.4" y2="377" stroke="#d6e7e0" stroke-width="1"/>
<text x="715.4" y="401" fill="#66827a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">15s</text>
<line x1="856.2" y1="115" x2="856.2" y2="377" stroke="#d6e7e0" stroke-width="1"/>
<text x="856.2" y="401" fill="#66827a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">20s</text>
<line x1="997.0" y1="115" x2="997.0" y2="377" stroke="#d6e7e0" stroke-width="1"/>
<text x="997.0" y="401" fill="#66827a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">25s</text>
<text x="45" y="142" fill="#123c34" font-family="Arial, sans-serif" font-size="18" font-weight="600">Whisper AUTO</text>
